<!doctype html>
<!-- Source for og.png. Render at exactly 1200 x 630 with any headless browser,
     for example a Playwright screenshot of this file, and save it as og.png. -->
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: oklch(97.4% 0.006 85); color: oklch(22% 0.011 65);
    font-family: 'Archivo', Arial, sans-serif; position: relative; overflow: hidden;
  }
  .bar { position: absolute; inset: 0 0 auto 0; height: 10px; background: oklch(57% 0.19 41); }
  .in { position: absolute; inset: 64px 72px 56px 72px; display: flex; flex-direction: column; }
  .eyebrow { font-family: 'Fragment Mono', monospace; font-size: 19px; letter-spacing: .12em; text-transform: uppercase; color: oklch(50% 0.010 70); }
  .eyebrow b { color: oklch(57% 0.19 41); font-weight: 400; padding-inline: 6px; }
  h1 { margin-top: 26px; font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -.026em; font-variation-settings: 'wdth' 108; max-width: 15ch; }
  h1 span { color: oklch(57% 0.19 41); }
  .foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; border-top: 2px solid oklch(22% 0.011 65); padding-top: 22px; }
  .name { font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  .url { font-family: 'Fragment Mono', monospace; font-size: 18px; color: oklch(47% 0.16 41); margin-top: 6px; }
  .nums { display: flex; gap: 34px; }
  .n b { display: block; font-size: 40px; line-height: 1; font-weight: 800; font-variation-settings: 'wdth' 75; }
  .n span { display: block; margin-top: 6px; font-family: 'Fragment Mono', monospace; font-size: 14px; color: oklch(40% 0.011 68); max-width: 17ch; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="in">
    <p class="eyebrow">Business automation engineer<b>&middot;</b>Cape Town</p>
    <h1>I automate business processes and <span>prove the impact.</span></h1>
    <div class="foot">
      <div>
        <p class="name">Ruan Grobler</p>
        <p class="url">portfolio.receva.co.za</p>
      </div>
      <div class="nums">
        <p class="n"><b>5</b><span>systems live in my first 30 days</span></p>
        <p class="n"><b>1,165,043</b><span>rows in a public SQL warehouse</span></p>
        <p class="n"><b>PL-900</b><span>verified with Microsoft</span></p>
      </div>
    </div>
  </div>
</body>
</html>
